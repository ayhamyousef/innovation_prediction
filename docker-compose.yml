version: "3.9"

services:
  # Step 1: Fetch USPTO patent data via ODP API
  fetch-data:
    build: .
    command: ["scripts/01_fetch_data.py", "--start-year", "2002", "--end-year", "2022", "--max-pages", "5"]
    volumes:
      - ./data:/app/data
    environment:
      - ODP_API_KEY=${ODP_API_KEY}

  # Step 2: Extract IPC-pair technologies + 7 features + trajectories
  build-trajectories:
    build: .
    command: ["scripts/02_build_trajectories.py"]
    volumes:
      - ./data:/app/data

  # Step 3: DTW + k-means clustering (k=4)
  cluster:
    build: .
    command: ["scripts/03_cluster_patterns.py"]
    volumes:
      - ./data:/app/data

  # Step 4: Train BERT-based transformer classifier
  train-transformer:
    build: .
    command: ["scripts/05_train_transformer.py"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Step 5: Train all baseline models (TF-IDF+LR, metadata-only, combined)
  train-baselines:
    build: .
    command: ["scripts/06_train_baselines.py"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  # Step 6: Run ablation studies
  ablations:
    build: .
    command: ["scripts/07_run_ablations.py", "--variants", "text_only,metadata_text,length_128,length_256,small_model"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
