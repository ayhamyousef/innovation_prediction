# One service per pipeline stage, in the order given in the README. Run them
# individually, e.g. `docker compose run --rm feature-selection`, since each
# stage consumes the previous stage's output.
#
# The stages that train torch models (classify, sequence-autoencoder,
# gru-downstream) declare a GPU reservation. Remove the `deploy:` block to run
# them on CPU; they work either way, more slowly.

services:
  # Stage 01: fetch USPTO patent records via the Open Data Portal API
  fetch-data:
    build: .
    command: ["scripts/01_fetch_data.py", "--start-year", "2002", "--end-year", "2022"]
    volumes:
      - ./data:/app/data
    environment:
      - ODP_API_KEY=${ODP_API_KEY}

  # Stage 02: novel technologies, reuse trajectories, the seven features
  build-trajectories:
    build: .
    command: ["scripts/02_build_trajectories.py"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  # Stage 03: trajectory-shape labels
  cluster-patterns:
    build: .
    command: ["scripts/03_cluster_patterns.py"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  # Stage 04: FAE unsupervised feature selection, K in {3,4,5}
  feature-selection:
    build: .
    command: ["scripts/04_feature_selection.py"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  # Stage 04b: emergence-profile labels from the FAE K=3 features
  recluster:
    build: .
    command: ["scripts/04b_recluster.py", "--fae-k", "3"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  # Stage 04b on all seven features: the table the later analyses read
  recluster-all7:
    build: .
    command: ["scripts/04b_recluster.py"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  # Stage 05: the seven tabular classifiers
  classify:
    build: .
    command: ["scripts/05_classify.py",
              "--labeled-csv", "results/clustering/technologies_labeled_fae_k3_k3.csv",
              "--features", "SIM_TECH", "ACCESS_SIZE", "SIM_ACCESS",
              "--models", "tabnet", "gbdt", "extra_trees", "tabm", "ft_transformer", "tabkan", "tabmixer"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Stage 06: exhaustive feature-subset ablation
  ablation:
    build: .
    command: ["scripts/06_ablation_subsets.py"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  # Stage 16: GRU sequence autoencoder, sequence-based labels
  sequence-autoencoder:
    build: .
    command: ["scripts/16_sequence_autoencoder.py", "--latent-dim", "8", "--l1", "0.01"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Stage 17: cluster-count sweep and downstream prediction of the sequence labels
  gru-downstream:
    build: .
    command: ["scripts/17_gru_ksweep_downstream.py"]
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
