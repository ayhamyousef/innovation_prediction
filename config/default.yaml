# ============================================================
# Innovation prediction pipeline: default configuration
# ============================================================

# --- Data collection (USPTO Open Data Portal) ---
data:
  # The API key is read from the environment variable ODP_API_KEY.
  start_year: 2002
  end_year: 2022
  observation_window_years: 20
  min_reuse_frequency: 20
  classification_digits: 6      # first 6 chars of CPC/IPC code
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  cache_dir: "data/cache"
  max_patents_per_request: 100
  request_delay_sec: 1.0

# --- Feature extraction ---
features:
  access_window_years: 5             # years before emergence for ACCESS_SIZE
  sim_tech_weights: [0.5, 0.3, 0.2]  # w1, w2, w3 for SIM_TECH

# --- Trajectory clustering (scripts/03_cluster_patterns.py) ---
clustering:
  method: "dtw_kmeans"           # dtw_kmeans or euclidean_kmeans
  n_clusters: 4
  dtw_window: null               # Sakoe-Chiba band width, null=no constraint
  n_init: 10
  max_iter: 300
  random_state: 42
  z_score_normalize: true

# --- Run settings ---
training:
  output_dir: "outputs"          # log directory
  seed: 42
